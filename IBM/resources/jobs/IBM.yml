resources:
  jobs:
    dev_rana_IBM:
      name: "[dev rana] IBM"
      email_notifications:
        on_success:
          - rana@ghazzi.com
        on_failure:
          - rana@ghazzi.com
      max_concurrent_runs: 4
      tasks:
        - task_key: API-Ingestion
          notebook_task:
            notebook_path: ../notebooks/IBM_landing.ipynb
            source: WORKSPACE
        - task_key: Auto_Loader_bronze
          depends_on:
            - task_key: API-Ingestion
          notebook_task:
            notebook_path: ../notebooks/IBM_autoLoader_bronze.ipynb
            source: WORKSPACE
        - task_key: Silver_Merge
          depends_on:
            - task_key: Auto_Loader_bronze
          notebook_task:
            notebook_path: ../notebooks/IBM_silver.ipynb
            source: WORKSPACE
      tags:
        dev: rana
      queue:
        enabled: false
      performance_target: PERFORMANCE_OPTIMIZED